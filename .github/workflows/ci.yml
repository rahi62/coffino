name: Cafino CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cafino_test
          POSTGRES_USER: cafino
          POSTGRES_PASSWORD: cafino-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cafino -d cafino_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "ci-only-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DATABASE_URL: "postgresql://cafino:cafino-ci@127.0.0.1:5432/cafino_test"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    env:
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000/api/v1"
      NEXT_PUBLIC_API_ROOT: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: npm run build

  electron:
    runs-on: windows-latest
    defaults: {run: {working-directory: electron}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: node --check src/main.js
      - run: node --check src/preload.js

  static-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python scripts/release-check.py
