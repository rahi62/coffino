name: Cafino CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cafino_test
          POSTGRES_USER: cafino
          POSTGRES_PASSWORD: cafino-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cafino -d cafino_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "ci-only-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DATABASE_URL: "postgresql://cafino:cafino-ci@127.0.0.1:5432/cafino_test"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: sh -n start-web.sh
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    env:
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000/api/v1"
      NEXT_PUBLIC_API_ROOT: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: npm test
      - run: npm run build

  electron:
    runs-on: windows-latest
    defaults: {run: {working-directory: electron}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check src/main.js
      - run: node --check src/preload.js
      - run: node --check src/entry.js
      - run: node --check src/release-runtime.js
      - run: node --check src/release-ops.js
      - run: node --check src/offline-license.js
      - run: node --check src/updater.js
      - run: node --check src/device-adapters.js
      - run: node --check src/ops-client.js
      - run: npm run test:release

  installer-contract:
    runs-on: windows-latest
    defaults: {run: {working-directory: electron}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - shell: pwsh
        run: |
          New-Item release-resources/backend -ItemType Directory -Force | Out-Null
          New-Item release-resources/frontend -ItemType Directory -Force | Out-Null
          New-Item release-resources/config -ItemType Directory -Force | Out-Null
          Set-Content release-resources/backend/cafino-backend.exe "ci-stub"
          Set-Content release-resources/frontend/server.js "console.log('ci-stub')"
          Set-Content release-resources/config/release-config.json '{"updateUrl":"","releaseChannel":"stable","enforceLicense":false,"licensePublicKey":"","backupIntervalHours":24,"backupRetentionCount":14,"backupMaxAgeDays":60,"opsEndpoint":"","operationsEnabled":false,"telemetryEnabled":false,"heartbeatIntervalMinutes":60}'
      - run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
      - shell: pwsh
        run: |
          $installer=Get-ChildItem release -Filter "Cafino-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Write-Host "Installer contract: $($installer.Name) $($installer.Length) bytes"
          & "$env:GITHUB_WORKSPACE\scripts\smoke-test-installer.ps1" -Installer $installer.FullName

  static-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python scripts/release-check.py
      - run: node scripts/release-contract.js
      - run: node scripts/railway-contract.js
      - run: node scripts/pos-contract.js
      - run: node scripts/responsive-contract.js
