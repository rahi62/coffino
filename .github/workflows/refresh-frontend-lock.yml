name: Refresh Frontend Lock

on:
  push:
    branches:
      - agent/release-infrastructure-v2
    paths:
      - "frontend/package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-infrastructure-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh package lock deterministically
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Refresh frontend dependency lock"
          git push origin HEAD:agent/release-infrastructure-v2
