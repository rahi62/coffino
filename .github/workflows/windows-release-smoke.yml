name: Cafino Windows Installed Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "electron/**"
      - "scripts/build-release.ps1"
      - "scripts/setup-local.ps1"
      - "scripts/release-check.py"
      - "scripts/release-contract.js"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/windows-release-smoke.yml"

permissions:
  contents: read

jobs:
  installed-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Local build environment
        shell: powershell
        run: .\scripts\setup-local.ps1

      - name: Build full unsigned Local release
        shell: powershell
        run: .\scripts\build-release.ps1 -Channel stable

      - name: Silent install on clean path
        shell: pwsh
        run: |
          $installer=Get-ChildItem electron/release -Filter "Cafino-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced" }
          $installDir=Join-Path $env:RUNNER_TEMP "cafino-installed-smoke"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          & $installer.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with exit code $LASTEXITCODE" }
          $exe=Get-ChildItem $installDir -Filter "Cafino.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed Cafino.exe was not found under $installDir" }
          "CAF_INO_SMOKE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAF_INO_SMOKE_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch installed application and verify runtimes
        shell: pwsh
        env:
          ELECTRON_DISABLE_GPU: "1"
        run: |
          $process=Start-Process -FilePath $env:CAF_INO_SMOKE_EXE -PassThru
          try {
            $backend=$false
            $frontend=$false
            for($i=0;$i -lt 120;$i++) {
              try { $r=Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8000/api/v1/health/; if($r.StatusCode -eq 200){$backend=$true} } catch {}
              try { $r=Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:3000/; if($r.StatusCode -lt 500){$frontend=$true} } catch {}
              if($backend -and $frontend){break}
              Start-Sleep -Seconds 1
            }
            if(-not $backend){throw "Installed backend health endpoint never became ready"}
            if(-not $frontend){throw "Installed Next.js frontend never became ready"}
            Write-Host "Installed Cafino smoke passed: backend and frontend are reachable."
          }
          finally {
            taskkill /PID $process.Id /T /F 2>$null | Out-Null
          }

      - name: Verify uninstall entry exists
        shell: pwsh
        run: |
          $uninstaller=Get-ChildItem $env:CAF_INO_SMOKE_INSTALL_DIR -Filter "Uninstall*.exe" -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw "NSIS uninstaller was not installed" }
          Write-Host "Uninstaller contract: $($uninstaller.FullName)"
