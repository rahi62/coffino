services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cafino
      POSTGRES_USER: cafino
      POSTGRES_PASSWORD: cafino-dev
    volumes: [cafino_pg:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://cafino:cafino-dev@db:5432/cafino
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_SECURE_SSL_REDIRECT: "0"
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_API_ROOT: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_ROOT: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  cafino_pg:
