services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafino
      POSTGRES_USER: cafino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cafino_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafino -d cafino"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cafino_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../../backend
    restart: unless-stopped
    environment: &backend_environment
      CAF_INO_ENV: saas
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${CAF_INO_DOMAIN}
      CAF_INO_FRONTEND_ORIGIN: https://${CAF_INO_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${CAF_INO_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${CAF_INO_DOMAIN}
      DATABASE_URL: postgresql://cafino:${POSTGRES_PASSWORD}@db:5432/cafino
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_HSTS_SECONDS: "3600"
      GUNICORN_WORKERS: "3"
      GUNICORN_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAF_INO_BACKEND_PORT:-9860}:8000"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ../../backend
    restart: unless-stopped
    environment: *backend_environment
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../../backend
    restart: unless-stopped
    environment: *backend_environment
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${CAF_INO_DOMAIN}/api/v1
        NEXT_PUBLIC_API_ROOT: https://${CAF_INO_DOMAIN}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${CAF_INO_DOMAIN}/api/v1
      NEXT_PUBLIC_API_ROOT: https://${CAF_INO_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAF_INO_FRONTEND_PORT:-9861}:3000"

volumes:
  cafino_pg:
  cafino_redis:
